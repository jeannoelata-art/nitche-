<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de texte sur image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--ac:#1f5eff;--bg:#f2f5f7;--tx:#14202b;--bd:#c9d3dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:10px 10px 40px}
h1{font-size:19px;margin:4px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button,.btn{font:inherit;padding:10px 12px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:8px;cursor:pointer}
button.main,.btn.main{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{outline:3px solid var(--ac)}
button:disabled{opacity:.5}
#st{margin:6px 0;padding:8px 10px;background:#fff;border:1px solid var(--bd);border-radius:8px;font-size:14px;min-height:38px}
#wrap{overflow:auto;border:1px solid var(--bd);background:#e4e9ed;border-radius:8px;max-height:65vh}
#stage{position:relative;width:100%;line-height:0}
#cv{display:block;width:100%;height:auto;background:#fff}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#zl{position:absolute;inset:0}
#zl.draw{touch-action:none;cursor:crosshair}
#zl.draw .z{pointer-events:none}
.z{position:absolute;border:2px dashed var(--ac);background:rgba(31,94,255,.10);cursor:pointer}
.z.on{border-style:solid;background:rgba(31,94,255,.22)}
#panel{margin-top:10px;padding:12px;background:#fff;border:1px solid var(--bd);border-radius:10px;display:grid;gap:10px}
#panel label{display:grid;gap:4px;font-size:14px}
#panel input[type=text],#panel select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;width:100%}
#panel input[type=color]{width:56px;height:40px;padding:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row label{flex:1;min-width:120px}
.row label.chk{display:flex;align-items:center;gap:6px;flex:0 0 auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Éditeur de texte sur image</h1>

<div class="bar">
  <label class="btn main">1. Choisir l’image<input id="file" type="file" accept="image/*" hidden></label>
  <button id="detect" disabled>2. Détecter les textes</button>
  <button id="add" disabled>Ajouter une zone</button>
</div>
<div class="bar">
  <button id="zm">Zoom −</button><button id="zp">Zoom +</button>
  <button id="undo" disabled>Annuler</button>
</div>
<div id="st">Choisis une image pour commencer.</div>

<div id="wrap"><div id="stage"><canvas id="cv" width="300" height="150"></canvas><canvas id="ov" width="300" height="150"></canvas><div id="zl"></div></div></div>

<section id="panel" hidden>
  <label>Texte<input id="txt" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="row">
    <label>Police<select id="font"></select></label>
    <button id="auto" type="button">Police auto</button>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="bold"> Gras</label>
    <label class="chk"><input type="checkbox" id="ital"> Italique</label>
    <label class="chk">Couleur <input type="color" id="col" value="#000000"></label>
  </div>
  <label>Taille : <span id="szv"></span> px<input type="range" id="sz" min="6" max="400" step="0.5"></label>
  <label>Alignement<select id="al"><option value="left">À gauche</option><option value="center">Centré</option><option value="right">À droite</option></select></label>
  <div class="row">
    <button id="apply" class="main" type="button">Appliquer</button>
    <button id="del" type="button">Supprimer la zone</button>
    <button id="close" type="button">Fermer</button>
  </div>
</section>

<div class="bar" style="margin-top:14px">
  <button id="png" disabled>Exporter PNG</button>
  <button id="jpg" disabled>Exporter JPG</button>
  <button id="pdf" disabled>Exporter PDF</button>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d", { willReadFrequently: true });
const ov = $("ov"), ovc = ov.getContext("2d");
const zl = $("zl"), stage = $("stage");
const mc = document.createElement("canvas").getContext("2d");

const FONTS = [
  { n: "Arial", g: "Helvetica, sans-serif" }, { n: "Times New Roman", g: "Times, serif" },
  { n: "Georgia", g: "serif" }, { n: "Verdana", g: "sans-serif" },
  { n: "Courier New", g: "monospace" }, { n: "Roboto", g: "sans-serif" },
  { n: "Open Sans", g: "sans-serif" }, { n: "Lato", g: "sans-serif" },
  { n: "Montserrat", g: "sans-serif" }, { n: "Poppins", g: "sans-serif" },
  { n: "Merriweather", g: "serif" }, { n: "Playfair Display", g: "serif" },
  { n: "Oswald", g: "sans-serif" }
];
$("font").innerHTML = FONTS.map(f => `<option>${f.n}</option>`).join("");

let zones = [], sel = null, hist = [], busy = false, loaded = false;
let zoom = 1, drawMode = false, worker = null, pv = 0;

const setStatus = t => { $("st").textContent = t; };
const fontStr = (z, size) => {
  const f = FONTS.find(x => x.n === z.font) || FONTS[0];
  return `${z.italic ? "italic " : ""}${z.bold ? 700 : 400} ${size}px "${f.n}", ${f.g}`;
};
const hex = (r, g, b) => "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");

function enable() {
  ["detect", "add", "png", "jpg", "pdf"].forEach(i => $(i).disabled = !loaded);
  $("undo").disabled = hist.length === 0;
}

/* ---------- Chargement de l’image ---------- */
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const mx = 3200, k = Math.min(1, mx / Math.max(img.naturalWidth, img.naturalHeight));
    cv.width = ov.width = Math.round(img.naturalWidth * k);
    cv.height = ov.height = Math.round(img.naturalHeight * k);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    zones = []; sel = null; hist = []; loaded = true;
    $("panel").hidden = true; renderZones(); enable();
    setStatus("Image chargée. Touche « 2. Détecter les textes ».");
  };
  img.onerror = () => setStatus("Impossible de lire cette image.");
  img.src = URL.createObjectURL(f);
};

/* ---------- Lecture du texte (OCR) ---------- */
async function getWorker() {
  if (typeof Tesseract === "undefined") throw new Error("Connexion internet nécessaire pour charger le moteur de lecture.");
  if (!worker) {
    worker = await Tesseract.createWorker("fra+eng", 1, {
      logger: m => { if (m.status === "recognizing text") setStatus("Lecture du texte… " + Math.round(m.progress * 100) + " %"); }
    });
  }
  return worker;
}

$("detect").onclick = async () => {
  if (!loaded || busy) return;
  busy = true; closePanel();
  try {
    setStatus("Chargement du moteur de lecture… (la 1re fois peut durer 20 à 40 s)");
    const wk = await getWorker();
    const s = cv.width < 1600 ? 2 : 1;
    const c = document.createElement("canvas"); c.width = cv.width * s; c.height = cv.height * s;
    const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.2)";
    g.drawImage(cv, 0, 0, c.width, c.height);
    const { data } = await wk.recognize(c);
    const lines = data.lines || (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines));
    zones = lines.filter(l => l.text.trim().length > 0 && l.confidence > 25).map(l => {
      const t = l.text.trim().replace(/\s+/g, " ");
      return { x: l.bbox.x0 / s, y: l.bbox.y0 / s, w: (l.bbox.x1 - l.bbox.x0) / s, h: (l.bbox.y1 - l.bbox.y0) / s, orig: t, text: t, styled: false };
    });
    renderZones();
    setStatus(zones.length ? zones.length + " zones trouvées. Touche une zone bleue pour la modifier. Texte manquant : « Ajouter une zone »." : "Aucun texte trouvé. Utilise « Ajouter une zone » pour entourer un texte.");
  } catch (err) { setStatus("Erreur : " + err.message); }
  busy = false;
};

async function ocrRegion(x, y, w, h) {
  const s = 2, c = document.createElement("canvas"); c.width = w * s; c.height = h * s;
  c.getContext("2d").drawImage(cv, x, y, w, h, 0, 0, c.width, c.height);
  const wk = await getWorker();
  const { data } = await wk.recognize(c);
  return (data.text || "").replace(/\s+/g, " ").trim();
}

/* ---------- Zones ---------- */
function renderZones() {
  zl.innerHTML = "";
  zones.forEach(z => {
    const d = document.createElement("div");
    d.className = "z" + (z === sel ? " on" : "");
    d.style.left = z.x / cv.width * 100 + "%"; d.style.top = z.y / cv.height * 100 + "%";
    d.style.width = z.w / cv.width * 100 + "%"; d.style.height = z.h / cv.height * 100 + "%";
    d.onclick = e => { e.stopPropagation(); select(z); };
    zl.appendChild(d);
  });
}

$("add").onclick = () => {
  drawMode = !drawMode;
  $("add").classList.toggle("on", drawMode); zl.classList.toggle("draw", drawMode);
  setStatus(drawMode ? "Entoure le texte avec ton doigt (glisse un rectangle)." : "Mode ajout désactivé.");
};
let ds = null, dr = null;
zl.addEventListener("pointerdown", e => {
  if (!drawMode) return;
  const r = zl.getBoundingClientRect();
  ds = { x: e.clientX - r.left, y: e.clientY - r.top };
  dr = document.createElement("div"); dr.className = "z on"; zl.appendChild(dr);
  zl.setPointerCapture(e.pointerId); e.preventDefault();
});
zl.addEventListener("pointermove", e => {
  if (!ds) return;
  const r = zl.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  dr.style.left = Math.min(ds.x, cx) + "px"; dr.style.top = Math.min(ds.y, cy) + "px";
  dr.style.width = Math.abs(cx - ds.x) + "px"; dr.style.height = Math.abs(cy - ds.y) + "px";
});
zl.addEventListener("pointerup", async e => {
  if (!ds) return;
  const r = zl.getBoundingClientRect(), k = cv.width / r.width;
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const x = Math.max(0, Math.min(ds.x, cx) * k), y = Math.max(0, Math.min(ds.y, cy) * k);
  const w = Math.min(cv.width - x, Math.abs(cx - ds.x) * k), h = Math.min(cv.height - y, Math.abs(cy - ds.y) * k);
  ds = null; dr.remove(); dr = null;
  drawMode = false; $("add").classList.remove("on"); zl.classList.remove("draw");
  if (w < 8 || h < 8 || busy) return;
  busy = true;
  try {
    setStatus("Lecture de la zone…");
    const t = await ocrRegion(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    const z = { x, y, w, h, orig: t, text: t, styled: false };
    zones.push(z); renderZones(); busy = false; await select(z);
  } catch (err) { setStatus("Erreur : " + err.message); }
  busy = false;
});

/* ---------- Analyse : fond, couleur, position du texte ---------- */
function analyse(z) {
  const W = cv.width, H = cv.height, pad = 3, m = 3;
  const x = Math.max(0, Math.floor(z.x - pad)), y = Math.max(0, Math.floor(z.y - pad));
  const w = Math.min(W, Math.ceil(z.x + z.w + pad)) - x, h = Math.min(H, Math.ceil(z.y + z.h + pad)) - y;
  if (w < 2 || h < 2) return false;
  const X0 = Math.max(0, x - m), Y0 = Math.max(0, y - m), X1 = Math.min(W, x + w + m), Y1 = Math.min(H, y + h + m);
  const BW = X1 - X0, bd = ctx.getImageData(X0, Y0, BW, Y1 - Y0).data;
  const px = (ax, ay) => {
    ax = Math.min(X1 - 1, Math.max(X0, ax)); ay = Math.min(Y1 - 1, Math.max(Y0, ay));
    const i = ((ay - Y0) * BW + (ax - X0)) * 4; return [bd[i], bd[i + 1], bd[i + 2]];
  };
  const avg = a => { let r = 0, g = 0, b = 0; a.forEach(p => { r += p[0]; g += p[1]; b += p[2]; }); const n = a.length; return [r / n, g / n, b / n]; };
  const L = [], R = [], T = [], B = [];
  for (let r = 0; r < h; r++) {
    const a = [], b = [];
    for (let k = 1; k <= m; k++) { a.push(px(x - k, y + r)); b.push(px(x + w - 1 + k, y + r)); }
    L.push(avg(a)); R.push(avg(b));
  }
  for (let c = 0; c < w; c++) {
    const a = [], b = [];
    for (let k = 1; k <= m; k++) { a.push(px(x + c, y - k)); b.push(px(x + c, y + h - 1 + k)); }
    T.push(avg(a)); B.push(avg(b));
  }
  const cd = ctx.getImageData(x, y, w, h).data;
  const bg = new Float32Array(w * h * 3), dist = new Float32Array(w * h);
  let mx = 0;
  for (let r = 0; r < h; r++) {
    const ty = (r + .5) / h;
    for (let c = 0; c < w; c++) {
      const tx = (c + .5) / w, i = r * w + c;
      let d = 0;
      for (let k = 0; k < 3; k++) {
        bg[i * 3 + k] = ((L[r][k] * (1 - tx) + R[r][k] * tx) + (T[c][k] * (1 - ty) + B[c][k] * ty)) / 2;
        d += Math.abs(cd[i * 4 + k] - bg[i * 3 + k]);
      }
      dist[i] = d; if (d > mx) mx = d;
    }
  }
  const thr = Math.max(40, mx * .3), mask = new Uint8Array(w * h);
  let cr = 0, cg = 0, cb = 0, cn = 0, l = w, rr = -1, t = h, b = -1;
  const rows = new Uint32Array(h);
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const i = r * w + c;
    if (dist[i] > thr) {
      mask[i] = 1; rows[r]++;
      if (c < l) l = c; if (c > rr) rr = c; if (r < t) t = r; if (r > b) b = r;
      if (dist[i] >= mx * .7) { cr += cd[i * 4]; cg += cd[i * 4 + 1]; cb += cd[i * 4 + 2]; cn++; }
    }
  }
  if (rr < 0) { l = Math.round(pad); rr = w - 1 - pad; t = Math.round(pad); b = h - 1 - pad; }
  let mr = 0; rows.forEach(v => { if (v > mr) mr = v; });
  let base = b;
  for (let r = b; r >= t; r--) if (rows[r] >= mr * .3) { base = r; break; }
  const rad = Math.max(1, Math.round((b - t + 1) * .08));
  const tmp = new Uint8Array(w * h), dil = new Uint8Array(w * h);
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (mask[r * w + c])
    for (let k = Math.max(0, c - rad); k <= Math.min(w - 1, c + rad); k++) tmp[r * w + k] = 1;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (tmp[r * w + c])
    for (let k = Math.max(0, r - rad); k <= Math.min(h - 1, r + rad); k++) dil[k * w + c] = 1;
  const pc = document.createElement("canvas"); pc.width = w; pc.height = h;
  const pg = pc.getContext("2d"), pd = pg.createImageData(w, h);
  for (let i = 0; i < w * h; i++) if (dil[i]) {
    pd.data[i * 4] = bg[i * 3]; pd.data[i * 4 + 1] = bg[i * 3 + 1]; pd.data[i * 4 + 2] = bg[i * 3 + 2]; pd.data[i * 4 + 3] = 255;
  }
  pg.putImageData(pd, 0, 0);
  z.box = { x, y, w, h }; z.patchCv = pc;
  z.ink = { l: x + l, r: x + rr, t: y + t, b: y + b, base: y + base + 1 };
  z.mi = { mask, w, h, l, t, rr, b };
  z.autoColor = cn ? hex(cr / cn, cg / cn, cb / cn) : "#000000";
  return true;
}

/* ---------- Choix de la police la plus proche ---------- */
function inkWidth(font, text) {
  mc.font = font; const m = mc.measureText(text);
  return m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
}
function fitSize(z) {
  const mw = z.mi.rr - z.mi.l + 1;
  if (!z.orig) return Math.max(8, (z.mi.b - z.mi.t + 1) * 1.1);
  const w100 = inkWidth(fontStr(z, 100), z.orig);
  return Math.min(400, Math.max(6, w100 > 0 ? 100 * mw / w100 : 20));
}
async function pickFont(z) {
  const fb = { font: "Arial", bold: false };
  const txt = z.orig;
  if (!txt || txt.length < 2) return fb;
  try {
    await Promise.all(FONTS.flatMap(f => [400, 700].map(w => document.fonts.load(`${w} 20px "${f.n}"`, txt))));
  } catch (e) {}
  const mi = z.mi, mw = mi.rr - mi.l + 1, mh = mi.b - mi.t + 1;
  const o = document.createElement("canvas"), oc = o.getContext("2d", { willReadFrequently: true });
  const t = document.createElement("canvas"); t.width = mw; t.height = mh;
  const tc = t.getContext("2d", { willReadFrequently: true });
  let best = -1, res = fb;
  for (const f of FONTS) for (const bold of [false, true]) {
    const cand = { font: f.n, bold, italic: false };
    const w100 = inkWidth(fontStr(cand, 100), txt);
    if (w100 <= 0) continue;
    const s = Math.min(300, 100 * mw / w100);
    o.width = Math.ceil(mw) + 40; o.height = Math.ceil(s * 2) + 20;
    oc.clearRect(0, 0, o.width, o.height);
    oc.font = fontStr(cand, s); oc.fillStyle = "#000"; oc.textBaseline = "alphabetic";
    const abl = oc.measureText(txt).actualBoundingBoxLeft;
    oc.fillText(txt, 20 + abl, s * 1.4);
    const d = oc.getImageData(0, 0, o.width, o.height).data;
    let x0 = o.width, x1 = -1, y0 = o.height, y1 = -1;
    for (let r = 0; r < o.height; r++) for (let c = 0; c < o.width; c++) if (d[(r * o.width + c) * 4 + 3] > 100) {
      if (c < x0) x0 = c; if (c > x1) x1 = c; if (r < y0) y0 = r; if (r > y1) y1 = r;
    }
    if (x1 < 0) continue;
    tc.clearRect(0, 0, mw, mh);
    tc.drawImage(o, x0, y0, x1 - x0 + 1, y1 - y0 + 1, 0, 0, mw, y1 - y0 + 1);
    const td = tc.getImageData(0, 0, mw, mh).data;
    let inter = 0, uni = 0;
    for (let r = 0; r < mh; r++) for (let c = 0; c < mw; c++) {
      const a = mi.mask[(r + mi.t) * mi.w + c + mi.l] === 1, b = td[(r * mw + c) * 4 + 3] > 100;
      if (a && b) inter++; if (a || b) uni++;
    }
    const score = uni ? inter / uni : 0;
    if (score > best) { best = score; res = { font: f.n, bold }; }
  }
  return res;
}

/* ---------- Sélection et édition ---------- */
async function applyAutoStyle(z) {
  setStatus("Analyse de la police…");
  const r = await pickFont(z);
  z.font = r.font; z.bold = r.bold; z.italic = false; z.align = "left";
  z.size = fitSize(z);
}
async function select(z) {
  if (busy) return;
  busy = true;
  try {
    sel = null; ovc.clearRect(0, 0, ov.width, ov.height);
    if (!analyse(z)) { setStatus("Zone trop petite."); busy = false; return; }
    if (!z.styled) {
      z.color = z.autoColor; z.text = z.orig;
      await applyAutoStyle(z); z.styled = true;
    }
    z.dirty = false; sel = z; fillPanel(); renderZones();
    setStatus("Modifie le texte, puis touche « Appliquer ».");
    $("panel").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } catch (err) { setStatus("Erreur : " + err.message); }
  busy = false;
}
function fillPanel() {
  const z = sel; $("panel").hidden = !z; if (!z) return;
  $("txt").value = z.text; $("font").value = z.font; $("bold").checked = z.bold; $("ital").checked = z.italic;
  $("col").value = z.color; $("sz").value = z.size; $("szv").textContent = Math.round(z.size * 10) / 10; $("al").value = z.align;
}
function closePanel() { sel = null; $("panel").hidden = true; ovc.clearRect(0, 0, ov.width, ov.height); renderZones(); }

function drawText(c, z) {
  if (!z.text) return [z.ink.l, z.ink.l];
  c.save();
  c.font = fontStr(z, z.size); c.fillStyle = z.color; c.textBaseline = "alphabetic"; c.textAlign = "left";
  const m = c.measureText(z.text), abl = m.actualBoundingBoxLeft, abr = m.actualBoundingBoxRight;
  const L = z.ink.l, R = z.ink.r;
  const x = z.align === "left" ? L + abl : z.align === "right" ? R - abr : (L + R) / 2 - (abr - abl) / 2;
  c.fillText(z.text, x, z.ink.base);
  c.restore();
  return [x - abl, x + abr];
}
async function preview() {
  const z = sel; if (!z) return;
  const id = ++pv;
  try { await document.fonts.load(fontStr(z, z.size), z.text || "a"); } catch (e) {}
  if (id !== pv || sel !== z) return;
  ovc.clearRect(0, 0, ov.width, ov.height);
  ovc.drawImage(z.patchCv, z.box.x, z.box.y);
  drawText(ovc, z);
}
function edit(fn) { if (!sel) return; fn(sel); sel.dirty = true; $("szv").textContent = Math.round(sel.size * 10) / 10; preview(); }
$("txt").oninput = e => edit(z => z.text = e.target.value);
$("font").onchange = e => edit(z => { z.font = e.target.value; z.size = fitSize(z); $("sz").value = z.size; });
$("bold").onchange = e => edit(z => { z.bold = e.target.checked; z.size = fitSize(z); $("sz").value = z.size; });
$("ital").onchange = e => edit(z => { z.italic = e.target.checked; z.size = fitSize(z); $("sz").value = z.size; });
$("col").oninput = e => edit(z => z.color = e.target.value);
$("sz").oninput = e => edit(z => z.size = parseFloat(e.target.value));
$("al").onchange = e => edit(z => z.align = e.target.value);
$("auto").onclick = async () => {
  if (!sel || busy) return; busy = true;
  const z = sel; const keep = z.text;
  z.text = z.orig; await applyAutoStyle(z); z.text = keep; fillPanel();
  z.dirty = true; busy = false; setStatus("Police la plus proche choisie."); preview();
};

function pushHist() {
  hist.push({ img: ctx.getImageData(0, 0, cv.width, cv.height), zones: zones.map(z => Object.assign({}, z)) });
  if (hist.length > 6) hist.shift();
}
function commit() {
  const z = sel; if (!z) return;
  pushHist();
  ctx.drawImage(z.patchCv, z.box.x, z.box.y);
  const ext = drawText(ctx, z);
  ovc.clearRect(0, 0, ov.width, ov.height);
  const nx = Math.min(z.box.x, ext[0]), nr = Math.max(z.box.x + z.box.w, ext[1]);
  z.x = nx; z.w = nr - nx; z.y = z.box.y; z.h = z.box.h;
  z.orig = z.text; z.dirty = false;
  sel = null; $("panel").hidden = true; renderZones(); enable();
  setStatus("Modification appliquée. Tu peux en faire d’autres ou exporter.");
}
$("apply").onclick = commit;
$("close").onclick = closePanel;
$("del").onclick = () => { zones = zones.filter(z => z !== sel); closePanel(); };
$("undo").onclick = () => {
  const h = hist.pop(); if (!h) return;
  ctx.putImageData(h.img, 0, 0); zones = h.zones; closePanel(); enable();
  setStatus("Dernière modification annulée.");
};

/* ---------- Zoom ---------- */
function setZoom(v) { zoom = Math.min(5, Math.max(1, v)); stage.style.width = zoom * 100 + "%"; }
$("zp").onclick = () => setZoom(zoom + .5);
$("zm").onclick = () => setZoom(zoom - .5);

/* ---------- Export ---------- */
function save(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function flush() { if (sel && sel.dirty) commit(); }
$("png").onclick = () => { flush(); cv.toBlob(b => save(b, "image-modifiee.png"), "image/png"); };
$("jpg").onclick = () => { flush(); cv.toBlob(b => save(b, "image-modifiee.jpg"), "image/jpeg", .95); };
$("pdf").onclick = () => {
  flush();
  if (!window.jspdf) { setStatus("Connexion internet nécessaire pour créer le PDF."); return; }
  const pdf = new window.jspdf.jsPDF({ orientation: cv.width > cv.height ? "l" : "p", unit: "px", format: [cv.width, cv.height], hotfixes: ["px_scaling"] });
  pdf.addImage(cv.toDataURL("image/jpeg", .95), "JPEG", 0, 0, cv.width, cv.height);
  pdf.save("image-modifiee.pdf");
};
enable();
</script>
</body>
</html>
