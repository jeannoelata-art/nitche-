<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de texte sur image</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;color:#222}
  header{background:#1a73e8;color:#fff;padding:12px;text-align:center;font-size:18px}
  main{padding:10px;max-width:900px;margin:auto}
  .carte{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 1px 4px #0002}
  canvas{width:100%;height:auto;display:block;touch-action:none;background:#ddd;border-radius:6px}
  label{display:block;font-size:14px;margin:8px 0 3px}
  input,select,textarea,button{font-size:16px;padding:8px;width:100%;border:1px solid #bbb;border-radius:6px}
  input[type=color]{height:42px;padding:2px}
  input[type=checkbox]{width:auto}
  button{background:#1a73e8;color:#fff;border:0;margin-top:6px}
  button.rouge{background:#d93025}
  button.gris{background:#666}
  .ligne{display:flex;gap:8px}
  .ligne>div{flex:1}
  .aide{font-size:13px;color:#555}
</style>
</head>
<body>
<header>Éditeur de texte sur image</header>
<main>

  <div class="carte">
    <label>1. Choisir une image</label>
    <input type="file" id="fichier" accept="image/*">
    <p class="aide">2. Glisse le doigt pour entourer l'ancien texte, en laissant un peu de marge autour (le fond propre autour sert à reconstruire l'arrière-plan). Les réglages sont détectés automatiquement : tu n'as plus qu'à écrire le nouveau texte. Tape sur une zone pour la modifier.</p>
    <canvas id="cv" width="600" height="300"></canvas>
  </div>

  <div class="carte" id="panneau" style="display:none">
    <label>Nouveau texte</label>
    <textarea id="texte" rows="2"></textarea>

    <div class="ligne">
      <div>
        <label>Police</label>
        <select id="police">
          <option>Arial</option><option>Times New Roman</option><option>Georgia</option>
          <option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option>
          <option>Impact</option><option>Comic Sans MS</option>
        </select>
      </div>
      <div>
        <label>Taille (px)</label>
        <input type="number" id="taille" min="4" max="1000">
      </div>
    </div>

    <div class="ligne">
      <div><label>Couleur du texte</label><input type="color" id="couleur"></div>
      <div>
        <label>Fond</label>
        <select id="mode">
          <option value="auto">Reconstruit (dégradé)</option>
          <option value="uni">Couleur unie</option>
        </select>
      </div>
    </div>
    <div id="blocFond"><label>Couleur unie du fond</label><input type="color" id="fond"></div>

    <div class="ligne">
      <div>
        <label>Alignement</label>
        <select id="align">
          <option value="left">Gauche</option>
          <option value="center">Centre</option>
          <option value="right">Droite</option>
        </select>
      </div>
      <div>
        <label>Style</label>
        <select id="style">
          <option value="normal">Normal</option>
          <option value="bold">Gras</option>
          <option value="italic">Italique</option>
          <option value="italic bold">Gras italique</option>
        </select>
      </div>
    </div>

    <div class="ligne">
      <div><label>Décalage horizontal (px)</label><input type="number" id="dx"></div>
      <div><label>Décalage vertical (px)</label><input type="number" id="dy"></div>
      <div><label>Espacement lettres</label><input type="number" id="espacement" step="0.5"></div>
    </div>

    <label><input type="checkbox" id="ajuster"> Réduire le texte pour qu'il tienne dans la zone</label>

    <button id="btnAuto">Ré-analyser la zone (fond, couleur, taille)</button>
    <label>Ajouter une police (fichier .ttf ou .otf)</label>
    <input type="file" id="fichierPolice" accept=".ttf,.otf,.woff,.woff2">
    <button class="rouge" id="btnSuppr">Supprimer cette zone</button>
  </div>

  <div class="carte">
    <button id="btnPng">Télécharger en PNG</button>
    <button id="btnJpg">Télécharger en JPG</button>
    <button id="btnPdf">Télécharger en PDF</button>
    <button class="gris" id="btnJson">Copier les zones (JSON, pour PHP/Python)</button>
  </div>

</main>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const src = document.createElement('canvas');      // image d'origine, jamais modifiée
const sctx = src.getContext('2d', { willReadFrequently: true });
const $ = id => document.getElementById(id);

let img = null, blocs = [], sel = -1, action = null;
const PAD = 2;      // on efface un peu plus large que la zone dessinée (bords adoucis du texte)
const BANDE = 4;    // épaisseur de fond lue autour de la zone

/* ---------- Chargement de l'image ---------- */
$('fichier').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    cv.width = src.width = im.naturalWidth;
    cv.height = src.height = im.naturalHeight;
    sctx.drawImage(im, 0, 0);
    blocs = []; sel = -1;
    majPanneau(); dessiner(true);
  };
  im.src = URL.createObjectURL(f);
});

/* ---------- Reconstruction du fond ----------
   On lit les pixels juste autour de la zone (médiane, donc peu sensible
   à un reste de texte voisin), puis on les étire à l'intérieur :
   dégradé horizontal + dégradé vertical, moyennés. */
function mediane(liste) {
  const res = [0, 0, 0];
  for (let c = 0; c < 3; c++) {
    const v = liste.map(p => p[c]).sort((a, b) => a - b);
    res[c] = v[Math.floor(v.length / 2)];
  }
  return res;
}

function fondDegrade(x, y, w, h) {
  const X = Math.max(0, Math.round(x) - PAD), Y = Math.max(0, Math.round(y) - PAD);
  const X2 = Math.min(src.width, Math.round(x + w) + PAD), Y2 = Math.min(src.height, Math.round(y + h) + PAD);
  const W = Math.max(1, X2 - X), H = Math.max(1, Y2 - Y);
  const rx = Math.max(0, X - BANDE), ry = Math.max(0, Y - BANDE);
  const rw = Math.min(src.width, X2 + BANDE) - rx, rh = Math.min(src.height, Y2 + BANDE) - ry;
  const d = sctx.getImageData(rx, ry, rw, rh).data;
  const px = (ix, iy) => { const k = ((iy - ry) * rw + (ix - rx)) * 4; return [d[k], d[k + 1], d[k + 2]]; };

  const T = [], B = [], L = [], R = [];
  for (let i = 0; i < W; i++) {
    const ix = X + i, t = [], b = [];
    for (let k = 1; k <= BANDE; k++) {
      if (Y - k >= 0) t.push(px(ix, Y - k));
      if (Y2 - 1 + k < src.height) b.push(px(ix, Y2 - 1 + k));
    }
    T.push(t.length ? mediane(t) : null); B.push(b.length ? mediane(b) : null);
  }
  for (let j = 0; j < H; j++) {
    const iy = Y + j, l = [], r = [];
    for (let k = 1; k <= BANDE; k++) {
      if (X - k >= 0) l.push(px(X - k, iy));
      if (X2 - 1 + k < src.width) r.push(px(X2 - 1 + k, iy));
    }
    L.push(l.length ? mediane(l) : null); R.push(r.length ? mediane(r) : null);
  }
  // Bords manquants (zone au bord de l'image) : on utilise le bord opposé
  const tout = [...T, ...B, ...L, ...R].filter(Boolean);
  const moy = tout.length ? mediane(tout) : [255, 255, 255];
  for (let i = 0; i < W; i++) { T[i] = T[i] || B[i] || moy; B[i] = B[i] || T[i]; }
  for (let j = 0; j < H; j++) { L[j] = L[j] || R[j] || moy; R[j] = R[j] || L[j]; }

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d');
  const out = cx.createImageData(W, H), o = out.data;
  for (let j = 0; j < H; j++) {
    const v = H > 1 ? j / (H - 1) : 0;
    for (let i = 0; i < W; i++) {
      const u = W > 1 ? i / (W - 1) : 0, k = (j * W + i) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const hz = L[j][ch] * (1 - u) + R[j][ch] * u;
        const vt = T[i][ch] * (1 - v) + B[i][ch] * v;
        o[k + ch] = (hz + vt) / 2;
      }
      o[k + 3] = 255;
    }
  }
  cx.putImageData(out, 0, 0);
  const centre = (Math.floor(H / 2) * W + Math.floor(W / 2)) * 4;
  const hex = v => Math.round(v).toString(16).padStart(2, '0');
  return { canvas: c, data: o, X, Y, moyenne: '#' + hex(o[centre]) + hex(o[centre + 1]) + hex(o[centre + 2]) };
}

/* ---------- Analyse de l'ancien texte ----------
   On compare l'image d'origine au fond reconstruit : ce qui diffère
   est l'ancien texte. On en déduit couleur, taille et position. */
function analyser(f) {
  const W = f.canvas.width, H = f.canvas.height;
  const o = sctx.getImageData(f.X, f.Y, W, H).data, g = f.data;
  const dist = new Float32Array(W * H);
  let max = 0;
  for (let k = 0; k < W * H; k++) {
    const q = k * 4;
    const dd = Math.abs(o[q] - g[q]) + Math.abs(o[q + 1] - g[q + 1]) + Math.abs(o[q + 2] - g[q + 2]);
    dist[k] = dd; if (dd > max) max = dd;
  }
  if (max < 60) return null;                        // aucun texte détecté
  const seuil = Math.max(45, max * 0.45);
  let x0 = W, x1 = -1, y0 = H, y1 = -1;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (dist[j * W + i] >= seuil) {
      if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j;
    }
  }
  let r = 0, gg = 0, b = 0, n = 0;
  for (let k = 0; k < W * H; k++) {
    if (dist[k] >= max * 0.8) { const q = k * 4; r += o[q]; gg += o[q + 1]; b += o[q + 2]; n++; }
  }
  const hex = v => Math.round(v / n).toString(16).padStart(2, '0');
  return { couleur: '#' + hex(r) + hex(gg) + hex(b), x0: f.X + x0, x1: f.X + x1, y0: f.Y + y0, y1: f.Y + y1 };
}

function reglagesAuto(b) {
  const f = fondDegrade(b.x, b.y, b.w, b.h);
  b.fillCanvas = f.canvas; b.fillX = f.X; b.fillY = f.Y; b.fond = f.moyenne;
  const a = analyser(f);
  if (!a) return;
  const inkH = a.y1 - a.y0 + 1;
  b.taille = Math.max(6, Math.round(inkH / 0.9));
  b.couleur = a.couleur;
  const gauche = a.x0 - b.x, droite = (b.x + b.w) - a.x1;
  if (Math.abs(gauche - droite) < 0.1 * b.w) { b.align = 'center'; b.dx = Math.round((a.x0 + a.x1) / 2 - (b.x + b.w / 2)); }
  else if (gauche < droite) { b.align = 'left'; b.dx = Math.round(gauche - 2); }
  else { b.align = 'right'; b.dx = -Math.round(droite - 2); }
  b.dy = Math.round((a.y0 + a.y1) / 2 - (b.y + b.h / 2));
}

/* ---------- Dessin ---------- */
function ecrireBloc(b) {
  if (b.mode === 'auto') ctx.drawImage(b.fillCanvas, b.fillX, b.fillY);
  else { ctx.fillStyle = b.fond; ctx.fillRect(b.fillX, b.fillY, b.fillCanvas.width, b.fillCanvas.height); }

  const lignes = b.texte.split('\n');
  let taille = b.taille;
  const police = t => `${b.style} ${t}px "${b.police}"`;
  const lettres = 'letterSpacing' in ctx;
  if (lettres) ctx.letterSpacing = (b.espacement || 0) + 'px';
  ctx.font = police(taille);
  if (b.ajuster) {
    while (taille > 4 && (
      Math.max(...lignes.map(l => ctx.measureText(l).width)) > b.w - 4 ||
      lignes.length * taille * 1.2 > b.h - 2)) {
      taille -= 1; ctx.font = police(taille);
    }
  }
  ctx.fillStyle = b.couleur;
  ctx.textBaseline = 'middle';
  ctx.textAlign = b.align;
  const lh = taille * 1.2;
  const x = (b.align === 'left' ? b.x + 2 : b.align === 'right' ? b.x + b.w - 2 : b.x + b.w / 2) + b.dx;
  const y0 = b.y + b.h / 2 + b.dy - (lh * (lignes.length - 1)) / 2;
  lignes.forEach((l, i) => ctx.fillText(l, x, y0 + i * lh));
  if (lettres) ctx.letterSpacing = '0px';
}

function dessiner(avecInterface) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!img) return;
  ctx.drawImage(src, 0, 0);
  blocs.forEach(ecrireBloc);
  if (avecInterface && sel >= 0) {
    const b = blocs[sel];
    ctx.save();
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = Math.max(2, cv.width / 300);
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  }
  if (avecInterface && action && action.type === 'creer') {
    ctx.save();
    ctx.strokeStyle = '#d93025';
    ctx.lineWidth = Math.max(2, cv.width / 300);
    ctx.strokeRect(action.x, action.y, action.w, action.h);
    ctx.restore();
  }
}

/* ---------- Souris / doigt ---------- */
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}
function toucheBloc(p) {
  for (let i = blocs.length - 1; i >= 0; i--) {
    const b = blocs[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return i;
  }
  return -1;
}

cv.addEventListener('pointerdown', e => {
  if (!img) return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e);
  const i = toucheBloc(p);
  if (i >= 0) { sel = i; action = null; }
  else { sel = -1; action = { type: 'creer', x0: p.x, y0: p.y, x: p.x, y: p.y, w: 0, h: 0 }; }
  majPanneau(); dessiner(true);
});

cv.addEventListener('pointermove', e => {
  if (!action) return;
  const p = pos(e);
  action.x = Math.min(action.x0, p.x); action.y = Math.min(action.y0, p.y);
  action.w = Math.abs(p.x - action.x0); action.h = Math.abs(p.y - action.y0);
  dessiner(true);
});

cv.addEventListener('pointerup', () => {
  if (action && action.w > 8 && action.h > 8) {
    const b = {
      x: Math.round(action.x), y: Math.round(action.y), w: Math.round(action.w), h: Math.round(action.h),
      mode: 'auto', fond: '#ffffff', texte: 'Nouveau texte', police: 'Arial',
      taille: 20, couleur: '#000000', align: 'left', style: 'normal',
      ajuster: false, dx: 0, dy: 0, espacement: 0
    };
    reglagesAuto(b);
    blocs.push(b);
    sel = blocs.length - 1;
  }
  action = null;
  majPanneau(); dessiner(true);
});

/* ---------- Panneau de réglages ---------- */
function majPanneau() {
  $('panneau').style.display = sel >= 0 ? 'block' : 'none';
  if (sel < 0) return;
  const b = blocs[sel];
  $('texte').value = b.texte; $('police').value = b.police; $('taille').value = b.taille;
  $('couleur').value = b.couleur; $('fond').value = b.fond; $('mode').value = b.mode;
  $('align').value = b.align; $('style').value = b.style; $('ajuster').checked = b.ajuster;
  $('dx').value = b.dx; $('dy').value = b.dy; $('espacement').value = b.espacement;
  $('blocFond').style.display = b.mode === 'uni' ? 'block' : 'none';
}
function lier(id, cle, conv) {
  $(id).addEventListener('input', e => {
    if (sel < 0) return;
    const el = e.target;
    blocs[sel][cle] = conv ? conv(el) : el.value;
    if (id === 'mode') majPanneau();
    dessiner(true);
  });
}
const nombre = el => Number(el.value) || 0;
lier('texte', 'texte'); lier('police', 'police'); lier('couleur', 'couleur'); lier('fond', 'fond');
lier('mode', 'mode'); lier('align', 'align'); lier('style', 'style');
lier('taille', 'taille', el => Number(el.value) || 12);
lier('dx', 'dx', nombre); lier('dy', 'dy', nombre); lier('espacement', 'espacement', nombre);
lier('ajuster', 'ajuster', el => el.checked);

$('btnAuto').onclick = () => {
  if (sel < 0) return;
  reglagesAuto(blocs[sel]);
  majPanneau(); dessiner(true);
};
$('btnSuppr').onclick = () => {
  if (sel < 0) return;
  blocs.splice(sel, 1); sel = -1;
  majPanneau(); dessiner(true);
};

/* ---------- Police personnalisée ---------- */
$('fichierPolice').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const nom = f.name.replace(/\.[^.]+$/, '');
  const police = new FontFace(nom, await f.arrayBuffer());
  await police.load();
  document.fonts.add(police);
  const o = document.createElement('option');
  o.textContent = nom;
  $('police').appendChild(o);
  if (sel >= 0) { blocs[sel].police = nom; majPanneau(); dessiner(true); }
});

/* ---------- Export (taille d'origine de l'image) ---------- */
function telecharger(url, nom) {
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
}
function exporter(type, nom, qualite) {
  if (!img) return alert("Choisis d'abord une image.");
  dessiner(false);                                   // sans cadres bleus
  telecharger(cv.toDataURL(type, qualite), nom);
  dessiner(true);
}
$('btnPng').onclick = () => exporter('image/png', 'image-modifiee.png');
$('btnJpg').onclick = () => exporter('image/jpeg', 'image-modifiee.jpg', 0.95);
$('btnPdf').onclick = () => {
  if (!img) return alert("Choisis d'abord une image.");
  if (!window.jspdf) return alert("La bibliothèque PDF n'a pas pu se charger (connexion ?). Utilise PNG ou JPG.");
  dessiner(false);
  const { jsPDF } = window.jspdf;
  const w = cv.width, h = cv.height;
  const pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'px', format: [w, h], hotfixes: ['px_scaling'] });
  pdf.addImage(cv.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, w, h);
  pdf.save('image-modifiee.pdf');
  dessiner(true);
};
$('btnJson').onclick = async () => {
  const json = JSON.stringify(blocs.map(b => ({
    x: b.x, y: b.y, w: b.w, h: b.h, mode: b.mode, fond: b.fond, texte: b.texte,
    police: b.police, taille: b.taille, couleur: b.couleur, align: b.align, dx: b.dx, dy: b.dy
  })), null, 2);
  try { await navigator.clipboard.writeText(json); alert('Zones copiées.'); }
  catch (err) { prompt('Copie ce texte :', json); }
};
</script>
</body>
</html>
